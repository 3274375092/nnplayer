[package]
name = "nnplayer"
version = "0.1.24"
description = "nnplayer - 网易云音乐桌面客户端"
authors = ["nnplayer team"]
edition = "2021"

[lib]
name = "nnplayer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"

ncm-api = { path = "../ncm-api-rs" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }

thiserror = "1"
anyhow = "1"

log = "0.4"
env_logger = "0.11"

reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

qrcode = { version = "0.14", default-features = false }
image = "0.25"
base64 = "0.22"

directories = "6"
toml = "1"
chrono = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
