<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nnplayer</title>
    <!-- Inter 未随包分发：字体栈会回退到系统字体。
         若要保留 Inter，请自托管（@fontsource/inter 或本地 woff2）后再引入。 -->
    <script>
      // 桌面歌词窗是透明无边框窗（url: #/desktop-lyrics）。路由 chunk 里的
      // 透明样式是异步加载的，此前的首帧会先画出入口样式里的纸色矩形。
      // 在任何路由/样式代码之前给 <html> 打标记，让 styles.css 的 document
      // 级规则从第一帧起就清掉窗口背景（审计 #20）。
      if (location.hash.startsWith("#/desktop-lyrics")) {
        document.documentElement.classList.add("desktop-lyrics-window");
      }
    </script>
  </head>
  <body class="bg-bg text-text-primary antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
