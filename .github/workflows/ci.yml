name: CI

on:
  pull_request:
  push:
    branches: [main, master, v0.1]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Must run before setup-node: `cache: pnpm` needs pnpm on PATH.
      # Version comes from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Test lyric timing parser
        run: pnpm test:lyrics

      - name: Test theme token contrast
        run: pnpm test:theme

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Test Tauri crate
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --all-targets

      - name: Lint Tauri crate
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
