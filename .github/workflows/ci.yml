name: CI

on:
  pull_request:
  push:
    branches: [main, master, v0.1]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Test lyric timing parser
        run: npm run test:lyrics

      - name: Test theme token contrast
        run: npm run test:theme

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Test Tauri crate
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --all-targets

      - name: Lint Tauri crate
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
