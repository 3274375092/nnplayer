name: Release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Must run before setup-node: `cache: pnpm` needs pnpm on PATH.
      # Version comes from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # SHA 固定后必须显式声明工具链（@stable 分支引用才隐式带上）
          toolchain: stable

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        id: version
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri\tauri.conf.json -Raw -Encoding UTF8 | ConvertFrom-Json).version
          $expectedTag = "v$ver"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match app version $expectedTag"
          }
          "VERSION=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "version: $ver"

      - name: Test theme token contrast
        run: pnpm test:theme

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          generate_release_notes: true
          fail_on_unmatched_files: true

  linux:
    needs: release
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev patchelf libfuse2 rpm
      - run: pnpm install --frozen-lockfile
      - name: Build Linux bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles deb,appimage,rpm
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/rpm/*.rpm.sig
          fail_on_unmatched_files: true

  # latest.json 的唯一写入者：等两个平台的安装包和 .sig 都上传完，再合并清单。
  # Linux 必须同时列出 deb / rpm / AppImage，否则 tauri-plugin-updater 在
  # Linux 上会因 TargetsNotFound 直接失败（即使版本相同）。
  manifest:
    needs: [release, linux]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Read app version
        id: version
        run: |
          VERSION=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version)")
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download updater signatures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p updater-sigs
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.sig' \
            --dir updater-sigs \
            --clobber

      - name: Generate latest.json
        run: |
          set -euo pipefail

          find_one() {
            local pattern="$1"
            local matches
            matches=$(find updater-sigs -maxdepth 1 -name "$pattern" -print)
            local count
            count=$(printf '%s\n' "$matches" | sed '/^$/d' | wc -l)
            if [ "$count" -ne 1 ]; then
              echo "expected exactly one '$pattern' signature, found $count" >&2
              printf '%s\n' "$matches" >&2
              exit 1
            fi
            printf '%s\n' "$matches"
          }

          WINDOWS_SIG=$(find_one '*.exe.sig')
          DEB_SIG=$(find_one '*.deb.sig')
          RPM_SIG=$(find_one '*.rpm.sig')
          APPIMAGE_SIG=$(find_one '*.AppImage.sig')

          node tools/updater-manifest.mjs \
            --version "${{ steps.version.outputs.VERSION }}" \
            --notes "详见 https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}" \
            --out latest.json \
            --target "windows-x86_64=$WINDOWS_SIG" \
            --target "linux-x86_64-deb=$DEB_SIG" \
            --target "linux-x86_64-rpm=$RPM_SIG" \
            --target "linux-x86_64-appimage=$APPIMAGE_SIG" \
            --target "linux-x86_64=$APPIMAGE_SIG"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          files: latest.json
          overwrite_files: true
          fail_on_unmatched_files: true
