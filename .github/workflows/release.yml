name: Release
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install deps
        run: npm ci

      - name: Validate release version
        id: version
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri\tauri.conf.json -Raw -Encoding UTF8 | ConvertFrom-Json).version
          $expectedTag = "v$ver"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match app version $expectedTag"
          }
          "VERSION=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "version: $ver"

      - name: Test theme token contrast
        run: npm run test:theme

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Generate latest.json
        shell: pwsh
        run: |
          $sig = (Get-Content src-tauri\target\release\bundle\nsis\*.exe.sig -Raw).Trim()
          $ver = "${{ steps.version.outputs.VERSION }}"
          $json = @{
            version = $ver
            notes  = "详见 https://github.com/${{ github.repository }}/releases/tag/v$ver"
            platforms = @{
              "windows-x86_64" = @{
                signature = $sig
                url       = "https://github.com/${{ github.repository }}/releases/download/v$ver/nnplayer_$($ver)_x64-setup.exe"
              }
            }
          }
          $json | ConvertTo-Json -Depth 4 | Set-Content latest.json -Encoding UTF8

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri\target\release\bundle\nsis\*.exe
            src-tauri\target\release\bundle\nsis\*.exe.sig
            latest.json
          generate_release_notes: true

  linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 rpm
      - run: npm ci
      - name: Build Linux bundles
        run: npm run tauri build -- --bundles deb,appimage,rpm
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
