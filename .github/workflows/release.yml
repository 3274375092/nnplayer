name: Release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Must run before setup-node: `cache: pnpm` needs pnpm on PATH.
      # Version comes from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # SHA 固定后必须显式声明工具链（@stable 分支引用才隐式带上）
          toolchain: stable

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        id: version
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri\tauri.conf.json -Raw -Encoding UTF8 | ConvertFrom-Json).version
          $expectedTag = "v$ver"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match app version $expectedTag"
          }
          "VERSION=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "version: $ver"

      - name: Test theme token contrast
        run: pnpm test:theme

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      - name: Generate latest.json
        shell: pwsh
        run: |
          $sigFiles = @(Get-ChildItem src-tauri\target\release\bundle\nsis\*.exe.sig)
          if ($sigFiles.Count -ne 1) { throw "Expected exactly one updater signature, found $($sigFiles.Count)" }
          $sig = (Get-Content $sigFiles[0].FullName -Raw).Trim()
          $ver = "${{ steps.version.outputs.VERSION }}"
          $json = @{
            version = $ver
            notes  = "详见 https://github.com/${{ github.repository }}/releases/tag/v$ver"
            platforms = @{
              "windows-x86_64" = @{
                signature = $sig
                url       = "https://github.com/${{ github.repository }}/releases/download/v$ver/$($sigFiles[0].BaseName)"
              }
            }
          }
          $json | ConvertTo-Json -Depth 4 | Set-Content latest.json -Encoding UTF8

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            latest.json
          generate_release_notes: true

  linux:
    needs: release
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev patchelf libfuse2 rpm
      - run: pnpm install --frozen-lockfile
      - name: Build Linux bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles deb,appimage,rpm
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
